name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: set the repository variable SITE_URL (for example https://adasatoman.com)
      SITE_URL: ${{ vars.SITE_URL }}
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true

      # Runs only when the FTP_* secrets exist (see README). The server files
      # api/config.php, data/ and uploads/ are never touched.
      - name: Deploy to Hostinger over FTP
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            api/config.php
            data/**
            uploads/**
